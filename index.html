<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AFLW Match Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap');

  :root {
    --navy: #0a1628;
    --dark-blue: #142240;
    --accent: #3b82f6;
    --green: #22c55e;
    --red: #ef4444;
    --orange: #f59e0b;
    --white: #ffffff;
    --gray-light: #e2e8f0;
    --gray: #94a3b8;
    --bg: #0f172a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Montserrat', sans-serif;
    background: var(--bg);
    color: var(--white);
    min-height: 100vh;
    padding-bottom: 100px;
  }

  /* ── HEADER ── */
  .header {
    background: linear-gradient(135deg, var(--navy), var(--dark-blue));
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--accent);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header h1 { font-size: 18px; font-weight: 800; letter-spacing: 1px; }
  .header .match-clock {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  /* ── CONTROLS BAR ── */
  .controls {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    background: var(--dark-blue);
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
  }
  .controls button, .controls select {
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    font-size: 13px;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-start { background: var(--green); color: var(--navy); }
  .btn-pause { background: var(--orange); color: var(--navy); }
  .btn-reset { background: var(--red); color: var(--white); }
  .btn-add { background: var(--accent); color: var(--white); }
  .btn-export { background: #8b5cf6; color: var(--white); }
  .btn-quarter { background: var(--gray-light); color: var(--navy); }
  .controls button:active { transform: scale(0.95); }

  /* ── SETTINGS ROW ── */
  .settings-row {
    display: flex;
    gap: 10px;
    padding: 10px 16px;
    background: rgba(59,130,246,0.08);
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    font-size: 13px;
  }
  .settings-row label { color: var(--gray); font-weight: 600; }
  .settings-row input {
    width: 60px;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--gray);
    background: var(--navy);
    color: var(--white);
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    text-align: center;
  }

  /* ── QUARTER INDICATOR ── */
  .quarter-bar {
    text-align: center;
    padding: 8px;
    font-weight: 700;
    font-size: 14px;
    background: rgba(59,130,246,0.15);
    color: var(--accent);
    letter-spacing: 2px;
  }

  /* ── PLAYER LIST ── */
  .player-list { padding: 8px 12px; }

  .player-card {
    background: var(--dark-blue);
    border-radius: 12px;
    margin-bottom: 8px;
    overflow: hidden;
    border: 2px solid transparent;
    transition: border-color 0.4s, background 0.4s;
  }
  .player-card.on-ground { border-color: var(--green); }
  .player-card.warning { border-color: var(--orange); }
  .player-card.danger { border-color: var(--red); }

  .player-main {
    display: flex;
    align-items: center;
    padding: 10px 14px;
    gap: 12px;
  }

  .player-name-time {
    flex: 1;
    min-width: 0;
  }
  .player-name {
    font-weight: 700;
    font-size: 15px;
    transition: color 0.4s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .player-card.warning .player-name { color: var(--orange); }
  .player-card.danger .player-name { color: var(--red); text-shadow: 0 0 8px rgba(239,68,68,0.5); }

  .player-time {
    font-size: 12px;
    color: var(--gray);
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }
  .player-time .current-stint { color: var(--green); font-weight: 600; }
  .player-card.danger .player-time .current-stint { color: var(--red); }
  .player-card.warning .player-time .current-stint { color: var(--orange); }

  .time-bar-bg {
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    margin-top: 4px;
    overflow: hidden;
  }
  .time-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.5s, background 0.5s;
    background: var(--green);
  }
  .player-card.warning .time-bar-fill { background: var(--orange); }
  .player-card.danger .time-bar-fill { background: var(--red); }

  /* Toggle Button */
  .toggle-btn {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: 3px solid var(--gray);
    background: transparent;
    color: var(--gray);
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .toggle-btn.active {
    border-color: var(--green);
    background: rgba(34,197,94,0.15);
    color: var(--green);
  }
  .toggle-btn:active { transform: scale(0.9); }

  /* Stats Row */
  .stats-row {
    display: flex;
    justify-content: space-around;
    padding: 6px 14px 10px;
    gap: 4px;
  }
  .stat-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    flex: 1;
    transition: all 0.15s;
    color: var(--white);
    font-family: 'Montserrat', sans-serif;
  }
  .stat-btn:active { background: rgba(59,130,246,0.3); transform: scale(0.95); }
  .stat-label { font-size: 9px; font-weight: 600; color: var(--gray); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-value { font-size: 18px; font-weight: 800; margin-top: 2px; }
  .stat-btn .undo-stat {
    font-size: 8px;
    color: var(--red);
    cursor: pointer;
    margin-top: 1px;
    opacity: 0.7;
  }

  .remove-btn {
    background: none;
    border: none;
    color: var(--red);
    cursor: pointer;
    font-size: 16px;
    opacity: 0.5;
    padding: 4px;
  }
  .remove-btn:hover { opacity: 1; }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    justify-content: center;
    align-items: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--dark-blue);
    border-radius: 16px;
    padding: 24px;
    width: 90%;
    max-width: 400px;
    border: 2px solid var(--accent);
  }
  .modal h2 { margin-bottom: 16px; font-size: 18px; }
  .modal input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--gray);
    background: var(--navy);
    color: var(--white);
    font-family: 'Montserrat', sans-serif;
    font-size: 15px;
    margin-bottom: 12px;
  }
  .modal textarea {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--gray);
    background: var(--navy);
    color: var(--white);
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    margin-bottom: 12px;
    height: 100px;
    resize: vertical;
  }
  .modal .modal-actions { display: flex; gap: 8px; }
  .modal .modal-actions button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .modal-cancel { background: var(--gray); color: var(--navy); }
  .modal-confirm { background: var(--accent); color: var(--white); }

  /* ── SUMMARY TABLE (for export) ── */
  .summary-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    overflow-y: auto;
    padding: 20px;
  }
  .summary-overlay.active { display: block; }
  .summary-box {
    background: var(--dark-blue);
    border-radius: 16px;
    padding: 20px;
    max-width: 700px;
    margin: 0 auto;
    border: 2px solid var(--accent);
  }
  .summary-box h2 { margin-bottom: 12px; font-size: 18px; }
  .summary-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  .summary-table th, .summary-table td {
    padding: 8px 6px;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .summary-table th {
    background: var(--navy);
    font-weight: 700;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--accent);
  }
  .summary-table td { font-variant-numeric: tabular-nums; }
  .summary-close {
    margin-top: 16px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .summary-copy {
    margin-top: 8px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #8b5cf6;
    color: white;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 380px) {
    .player-name { font-size: 13px; }
    .stat-btn { padding: 5px 6px; }
    .stat-value { font-size: 15px; }
  }
</style>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#142240">
<link rel="apple-touch-icon" href="icon-192.png">

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js');
  });
}
</script>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <h1>⚡ MATCH TRACKER</h1>
  <div class="match-clock" id="matchClock">00:00</div>
</div>

<!-- QUARTER -->
<div class="quarter-bar" id="quarterBar">Q1</div>

<!-- CONTROLS -->
<div class="controls">
  <button class="btn-start" id="btnStartPause" onclick="toggleMatchClock()">▶ START</button>
  <button class="btn-quarter" onclick="nextQuarter()">NEXT QTR</button>
  <button class="btn-add" onclick="openAddModal()">+ PLAYER</button>
  <button class="btn-add" onclick="openBulkModal()">+ BULK</button>
  <button class="btn-export" onclick="showSummary()">📊 SUMMARY</button>
  <button class="btn-reset" onclick="confirmReset()">↺ RESET</button>
</div>

<!-- SETTINGS -->
<div class="settings-row">
  <label>⚠️ Warn at</label>
  <input type="number" id="warnMinutes" value="8" min="1" max="30"> <span>min</span>
  <label style="margin-left:10px;">🔴 Danger at</label>
  <input type="number" id="dangerMinutes" value="12" min="1" max="30"> <span>min</span>
</div>

<!-- PLAYER LIST -->
<div class="player-list" id="playerList"></div>

<!-- ADD PLAYER MODAL -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2>Add Player</h2>
    <input type="text" id="newPlayerName" placeholder="Player name..." autocomplete="off">
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeAddModal()">Cancel</button>
      <button class="modal-confirm" onclick="addPlayer()">Add</button>
    </div>
  </div>
</div>

<!-- BULK ADD MODAL -->
<div class="modal-overlay" id="bulkModal">
  <div class="modal">
    <h2>Bulk Add Players</h2>
    <textarea id="bulkNames" placeholder="One name per line..."></textarea>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeBulkModal()">Cancel</button>
      <button class="modal-confirm" onclick="bulkAddPlayers()">Add All</button>
    </div>
  </div>
</div>

<!-- SUMMARY OVERLAY -->
<div class="summary-overlay" id="summaryOverlay">
  <div class="summary-box">
    <h2>📊 Match Summary</h2>
    <div id="summaryContent"></div>
    <button class="summary-copy" onclick="copySummary()">📋 Copy to Clipboard</button>
    <button class="summary-close" onclick="closeSummary()">Close</button>
  </div>
</div>

<script>
// ── STATE ──
let players = [];
let matchRunning = false;
let matchSeconds = 0;
let matchInterval = null;
let currentQuarter = 1;
let nextId = 1;

// ── MATCH CLOCK ──
function toggleMatchClock() {
  const btn = document.getElementById('btnStartPause');
  if (matchRunning) {
    matchRunning = false;
    clearInterval(matchInterval);
    btn.textContent = '▶ START';
    btn.className = 'btn-start';
  } else {
    matchRunning = true;
    matchInterval = setInterval(tick, 1000);
    btn.textContent = '⏸ PAUSE';
    btn.className = 'btn-pause';
  }
}

function tick() {
  matchSeconds++;
  players.forEach(p => {
    if (p.onGround) {
      p.totalSeconds++;
      p.currentStintSeconds++;
    }
  });
  updateDisplay();
}

function nextQuarter() {
  if (currentQuarter < 4) {
    currentQuarter++;
    document.getElementById('quarterBar').textContent = 'Q' + currentQuarter;
    // Auto sub everyone off at quarter break
    players.forEach(p => {
      if (p.onGround) {
        p.onGround = false;
        p.currentStintSeconds = 0;
      }
    });
    updateDisplay();
  }
}

function confirmReset() {
  if (confirm('Reset entire match? This cannot be undone.')) {
    clearInterval(matchInterval);
    matchRunning = false;
    matchSeconds = 0;
    currentQuarter = 1;
    players = [];
    nextId = 1;
    document.getElementById('btnStartPause').textContent = '▶ START';
    document.getElementById('btnStartPause').className = 'btn-start';
    document.getElementById('quarterBar').textContent = 'Q1';
    updateDisplay();
  }
}

// ── PLAYERS ──
function openAddModal() {
  document.getElementById('addModal').classList.add('active');
  setTimeout(() => document.getElementById('newPlayerName').focus(), 100);
}
function closeAddModal() {
  document.getElementById('addModal').classList.remove('active');
  document.getElementById('newPlayerName').value = '';
}
function addPlayer() {
  const name = document.getElementById('newPlayerName').value.trim();
  if (!name) return;
  players.push({
    id: nextId++,
    name: name,
    onGround: false,
    totalSeconds: 0,
    currentStintSeconds: 0,
    clearances: 0,
    inside50s: 0,
    rebound50s: 0
  });
  closeAddModal();
  updateDisplay();
}

function openBulkModal() {
  document.getElementById('bulkModal').classList.add('active');
  setTimeout(() => document.getElementById('bulkNames').focus(), 100);
}
function closeBulkModal() {
  document.getElementById('bulkModal').classList.remove('active');
  document.getElementById('bulkNames').value = '';
}
function bulkAddPlayers() {
  const text = document.getElementById('bulkNames').value;
  const names = text.split('\n').map(n => n.trim()).filter(n => n.length > 0);
  names.forEach(name => {
    players.push({
      id: nextId++,
      name: name,
      onGround: false,
      totalSeconds: 0,
      currentStintSeconds: 0,
      clearances: 0,
      inside50s: 0,
      rebound50s: 0
    });
  });
  closeBulkModal();
  updateDisplay();
}

function removePlayer(id) {
  if (confirm('Remove this player?')) {
    players = players.filter(p => p.id !== id);
    updateDisplay();
  }
}

function toggleGround(id) {
  const p = players.find(x => x.id === id);
  if (!p) return;
  p.onGround = !p.onGround;
  if (p.onGround) {
    p.currentStintSeconds = 0;
  } else {
    p.currentStintSeconds = 0;
  }
  updateDisplay();
}

function addStat(id, stat) {
  const p = players.find(x => x.id === id);
  if (p) { p[stat]++; updateDisplay(); }
}
function undoStat(id, stat) {
  const p = players.find(x => x.id === id);
  if (p && p[stat] > 0) { p[stat]--; updateDisplay(); }
}

// ── DISPLAY ──
function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function updateDisplay() {
  document.getElementById('matchClock').textContent = formatTime(matchSeconds);

  const warnSec = parseInt(document.getElementById('warnMinutes').value) * 60 || 480;
  const dangerSec = parseInt(document.getElementById('dangerMinutes').value) * 60 || 720;

  const list = document.getElementById('playerList');
  // Sort: on-ground first, then by total time desc
  const sorted = [...players].sort((a, b) => {
    if (a.onGround !== b.onGround) return b.onGround - a.onGround;
    return b.totalSeconds - a.totalSeconds;
  });

  list.innerHTML = sorted.map(p => {
    let status = '';
    if (p.onGround) {
      if (p.currentStintSeconds >= dangerSec) status = 'on-ground danger';
      else if (p.currentStintSeconds >= warnSec) status = 'on-ground warning';
      else status = 'on-ground';
    }

    const pct = Math.min((p.currentStintSeconds / dangerSec) * 100, 100);

    return \`
    <div class="player-card \${status}">
      <div class="player-main">
        <button class="toggle-btn \${p.onGround ? 'active' : ''}" onclick="toggleGround(\${p.id})">
          \${p.onGround ? 'ON' : 'OFF'}
        </button>
        <div class="player-name-time">
          <div class="player-name">\${p.name}</div>
          <div class="player-time">
            Total: <strong>\${formatTime(p.totalSeconds)}</strong>
            \${p.onGround ? ' &nbsp;|&nbsp; Stint: <span class="current-stint">' + formatTime(p.currentStintSeconds) + '</span>' : ''}
          </div>
          \${p.onGround ? '<div class="time-bar-bg"><div class="time-bar-fill" style="width:' + pct + '%"></div></div>' : ''}
        </div>
        <button class="remove-btn" onclick="removePlayer(\${p.id})">✕</button>
      </div>
      <div class="stats-row">
        <div class="stat-btn" onclick="addStat(\${p.id},'clearances')">
          <span class="stat-label">CLR</span>
          <span class="stat-value">\${p.clearances}</span>
          <span class="undo-stat" onclick="event.stopPropagation(); undoStat(\${p.id},'clearances')">undo</span>
        </div>
        <div class="stat-btn" onclick="addStat(\${p.id},'inside50s')">
          <span class="stat-label">I50</span>
          <span class="stat-value">\${p.inside50s}</span>
          <span class="undo-stat" onclick="event.stopPropagation(); undoStat(\${p.id},'inside50s')">undo</span>
        </div>
        <div class="stat-btn" onclick="addStat(\${p.id},'rebound50s')">
          <span class="stat-label">R50</span>
          <span class="stat-value">\${p.rebound50s}</span>
          <span class="undo-stat" onclick="event.stopPropagation(); undoStat(\${p.id},'rebound50s')">undo</span>
        </div>
      </div>
    </div>\`;
  }).join('');
}

// ── SUMMARY ──
function showSummary() {
  const sorted = [...players].sort((a, b) => b.totalSeconds - a.totalSeconds);
  let html = '<table class="summary-table"><thead><tr>';
  html += '<th>Player</th><th>Total Time</th><th>CLR</th><th>I50</th><th>R50</th>';
  html += '</tr></thead><tbody>';
  sorted.forEach(p => {
    html += \`<tr>
      <td style="text-align:left; font-weight:600;">\${p.name}</td>
      <td>\${formatTime(p.totalSeconds)}</td>
      <td>\${p.clearances}</td>
      <td>\${p.inside50s}</td>
      <td>\${p.rebound50s}</td>
    </tr>\`;
  });
  html += '</tbody></table>';
  document.getElementById('summaryContent').innerHTML = html;
  document.getElementById('summaryOverlay').classList.add('active');
}

function closeSummary() {
  document.getElementById('summaryOverlay').classList.remove('active');
}

function copySummary() {
  const sorted = [...players].sort((a, b) => b.totalSeconds - a.totalSeconds);
  let text = 'MATCH SUMMARY - Q' + currentQuarter + ' | Match Time: ' + formatTime(matchSeconds) + '\n';
  text += '─'.repeat(50) + '\n';
  text += 'Player'.padEnd(20) + 'Time'.padEnd(10) + 'CLR'.padEnd(6) + 'I50'.padEnd(6) + 'R50\n';
  text += '─'.repeat(50) + '\n';
  sorted.forEach(p => {
    text += p.name.padEnd(20) + formatTime(p.totalSeconds).padEnd(10) + String(p.clearances).padEnd(6) + String(p.inside50s).padEnd(6) + p.rebound50s + '\n';
  });
  navigator.clipboard.writeText(text).then(() => {
    alert('Summary copied to clipboard!');
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('Summary copied!');
  });
}

// Enter key support for add modal
document.getElementById('newPlayerName').addEventListener('keydown', e => {
  if (e.key === 'Enter') addPlayer();
});

// Initial render
updateDisplay();
</script>
</body>
</html>
